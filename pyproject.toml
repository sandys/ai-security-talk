[project]
name = "responsible-ai-ai-security-developer-workshop"
version = "1.0.0"
description = "Hands-on Responsible AI and AI security labs for developers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jupyterlab>=4.4,<5", "numpy>=2.0,<3", "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2", "pydantic>=2.10,<3",
  "opentelemetry-sdk>=1.30,<2", "pytm==1.4.0", "garak==0.16.0",
  "guardrails-ai==0.11.0", "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364", "inspect-ai==0.3.259",
  "modelscan==0.8.8", "fairlearn==0.14.0"
]
[tool.pytest.ini_options]
addopts = "-q"
